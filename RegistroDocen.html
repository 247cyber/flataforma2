<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyMatric - Registro Administrador</title>
    <link rel="stylesheet" href="estilos/global.css">
    <link rel="stylesheet" href="estilos/RegistroAd.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <div class="pantalla-fondo">
        <div class="cuadro-registro-admin">
            
            <div class="registro-header">
                <img src="imagenes/LogoAzulSin.png" alt="EasyMatric" class="logo-easymatric">
                <div class="badge-admin">PERFIL DOCENTE </div>
                <h1>Crear Cuenta Docente</h1>
                <p>Configura tu perfil académico para la gestión de notas y grupos de los modulos</p>
            </div>

            <form action="procesar_docente.php" method="POST">
                
                <div class="fila-input">
                    <div class="grupo-input">
                        <i class="bi bi-person-gear"></i>
                        <input type="text" name="nombre_docente" placeholder="Nombre Completo" required>
                    </div>
                </div>

                <div class="fila-input">
                    <div class="grupo-input" style="flex: 1.2;">
                        <i class="bi bi-building"></i>
                        <input type="text" name="institucion" placeholder="Nombre de la Institución" required>
                    </div>
                    <div class="grupo-input" style="flex: 0.8;">
                        <i class="bi bi-hash"></i>
                        <input type="text" name="nit_institucion" placeholder="NIT / Código" required>
                    </div>
                </div>

                <div class="fila-input">
                    <div class="grupo-input" style="flex: 1;">
                        <i class="bi bi-card-checklist"></i>
                        <input type="text" name="n_documento" placeholder="Cédula de Ciudadanía" required>
                    </div>
                    <div class="grupo-input" style="flex: 1;">
                        <select class="select-input" name="jornada" required>
                            <option value="" disabled selected>Jornada</option>
                            <option value="Manana">Mañana</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Unica">Jornada Única</option>
                            <option value="Nocturna">Nocturna</option>
                        </select>
                    </div>

                    <div class="grupo-input" style="flex: 0.8;">
                        <select class="select-input" name="escalafon" required>
                            <option value="" disabled selected>Tipo Contrato</option>
                            <option value="Planta">Planta</option>
                            <option value="Provisional">Provisional</option>
                            <option value="Catedra">Cátedra</option>
                        </select>
                    </div>
                </div>

                <div class="fila-input">
                    <div class="grupo-input">
                        <i class="bi bi-telephone-plus"></i>
                        <input type="tel" name="telefono" placeholder="Teléfono Institucional" required>
                    </div>
                    <div class="grupo-input">
                        <i class="bi bi-envelope-check"></i>
                        <input type="email" name="correo" placeholder="Correo de Contacto" required>
                    </div>
                </div>

                <div class="fila-input">
                    <div class="grupo-input">
                        <i class="bi bi-shield-lock-fill"></i>
                        <input type="password" name="pass" placeholder="Crear Contraseña" required>
                    </div>
                    <div class="grupo-input">
                        <i class="bi bi-shield-check"></i>
                        <input type="password" name="pass_confirm" placeholder="Repetir Contraseña" required>
                    </div>
                </div>

                <div class="contenedor-terminos" style="margin: 15px 0; font-size: 0.8rem; color: #64748b;">
                    <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                        <input type="checkbox" name="terminos" required style="margin-top: 3px;">
                        <span>Acepto el tratamiento de datos personales y los <a href="#" style="color: #4facfe; text-decoration: none;">Términos de Servicio</a>.</span>
                    </label>
                </div>

                <div class="contenedor-boton">
                    <a href="perfilDocente.html" class="btn-registrar"><i class= "bi bi-person-plus"></i>crear cuenta</a>
                </div>

            </form>

            <div class="pie-cuadro">
                <div class="botones-inferiores">
                    <a href="SelecionRol.html" class="btn-mini"><i class="bi bi-arrow-left"></i> Cambiar Rol</a>
                    <a href="index.html" class="btn-mini"><i class="bi bi-question-circle"></i> Ayuda</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
